# rules.yaml — conjunto de regras de detecção do edge-waf-engine.
#
# Este arquivo espelha exatamente o conjunto padrão hardcoded em
# internal/application/default_rules.go (ver Issue 5) — serve como
# ponto de partida editável: ajuste, remova ou adicione regras aqui sem
# precisar recompilar o binário (RF07, ADR-003).
#
# Campos de cada regra:
#   id:          identificador único (usado em logs e detecção de duplicatas)
#   category:    sql_injection | xss | path_traversal | command_injection
#   pattern:     expressão regular (sintaxe RE2 do Go — sem lookahead/lookbehind)
#   targets:     lista com um ou mais de: query, body, headers
#   severity:    low | medium | high | critical
#   description: texto livre, usado em documentação/logs

rules:
  # --- SQL Injection ---
  - id: sqli-001-union-select
    category: sql_injection
    pattern: "(?i)\\bunion\\b(?:\\s+all)?\\s+select\\b"
    targets: [query, body]
    severity: high
    description: "Detecta UNION SELECT, usado para extrair dados de outras tabelas."

  - id: sqli-002-tautology
    category: sql_injection
    pattern: "(?i)\\b(or|and)\\b\\s*['\"]?\\w+['\"]?\\s*=\\s*['\"]?\\w+['\"]?"
    targets: [query, body]
    severity: high
    description: "Detecta condições tautológicas clássicas (ex: ' OR '1'='1)."

  - id: sqli-003-quote-comment-breakout
    category: sql_injection
    pattern: "(?i)['\"]\\s*(--|#)"
    targets: [query, body]
    severity: high
    description: "Detecta fechamento de aspas seguido de comentário SQL (ex: admin'--)."

  - id: sqli-004-stacked-query
    category: sql_injection
    pattern: "(?i);\\s*(drop|delete|truncate|update|insert)\\s+"
    targets: [query, body]
    severity: critical
    description: "Detecta stacked queries com comandos destrutivos."

  # --- XSS ---
  - id: xss-001-script-tag
    category: xss
    pattern: "(?i)<script[\\s>]"
    targets: [query, body]
    severity: high
    description: "Detecta tags <script>, o vetor mais comum de XSS."

  - id: xss-002-event-handler
    category: xss
    pattern: "(?i)\\bon(error|load|click|mouseover|focus)\\s*="
    targets: [query, body]
    severity: high
    description: "Detecta handlers de evento inline (onerror=, onload=, etc)."

  - id: xss-003-javascript-uri
    category: xss
    pattern: "(?i)javascript:\\s*\\S"
    targets: [query, body]
    severity: medium
    description: "Detecta URIs javascript: usadas em href/src para executar código."

  # --- Path Traversal ---
  - id: pathtrav-001-dot-dot-slash
    category: path_traversal
    pattern: "\\.\\.[/\\\\]"
    targets: [query]
    severity: high
    description: "Detecta sequências ../ ou ..\\ usadas para sair do diretório esperado."

  - id: pathtrav-002-encoded-dot-dot-slash
    category: path_traversal
    pattern: "(?i)%2e%2e(%2f|%5c|/)"
    targets: [query]
    severity: high
    description: "Detecta a mesma sequência, URL-encoded (ex: %2e%2e%2f)."

  - id: pathtrav-003-sensitive-file
    category: path_traversal
    pattern: "(?i)(etc/passwd|boot\\.ini|win\\.ini)"
    targets: [query]
    severity: critical
    description: "Detecta referência direta a arquivos sensíveis clássicos."

  # --- Command Injection ---
  - id: cmdi-001-chained-shell-command
    category: command_injection
    pattern: "(?i)[;&|]\\s*(ls|cat|whoami|id|uname|wget|curl|nc|bash|sh|ping|nslookup)\\b"
    targets: [query, body]
    severity: critical
    description: "Detecta encadeamento de shell seguido de comando comum de atacante."

  - id: cmdi-002-dollar-subshell
    category: command_injection
    pattern: "\\$\\([^)]+\\)"
    targets: [query, body]
    severity: critical
    description: "Detecta substituição de comando via $(...) (subshell)."

  - id: cmdi-003-backtick-subshell
    category: command_injection
    pattern: "`[^`]+`"
    targets: [query, body]
    severity: critical
    description: "Detecta substituição de comando via crases (subshell estilo legado)."
